stages:
  - deploy

variables:
  VERSION: "1.0.0-SNAPSHOT"
  # Docker (root) bind-mounts build/*.jar; gitlab-runner cannot delete them on checkout.
  GIT_CLEAN_FLAGS: "-ffdx --exclude=service/*/build/ --exclude=api-gateway/build/ --exclude=build/ --exclude=.gradle/"

.deploy_template:
  stage: deploy
  before_script:
    - export GRADLE_USER_HOME="$(pwd)/.gradle"
    - export VERSION="${VERSION:-1.0.0-SNAPSHOT}"
    - chmod +x ./gradlew
  script:
    # 1. AVVAL build. Fail bo'lsa ishlab turgan konteynerlarga TEGMAYMIZ (outage yo'q).
    - |
      if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
        ./gradlew build -x test --no-daemon
      else
        echo "gradle-wrapper.jar missing, using system gradle"
        gradle build -x test --no-daemon
      fi
    # 2. Faqat app konteynerlarni majburan o'chiramiz (postgres/rabbitmq tegilmaydi —
    #    DB restart bo'lmaydi). Nom konflikti ham shu bilan tozalanadi.
    - |
      for container in \
        business-gateway \
        main-service \
        log-service \
        file-service \
        document-service \
        notification-service \
        integration-service
      do
        docker rm -f "$container" 2>/dev/null || true
      done
    # 3. O'chirilgan app konteynerlarni yangi jar'lar bilan qayta yaratamiz.
    #    --force-recreate YO'Q → postgres/rabbitmq qayta yaratilmaydi.
    - docker compose up -d --remove-orphans
  # after_script'da DESTRUCTIVE `down` YO'Q — deploy fail bo'lsa mavjud konteynerlar
  # ishlab tursin (yarim-deploy butun prod'ni o'chirmasin).

# =========================
# DEV — o'chirildi (2026-08-15)
# =========================
# Dev muhiti yopildi: dev branch prod'dan oylab orqada qolar, dev DB alohida
# liniya edi va u yerdagi sinov prod holatini aks ettirmasdi. Endi ish
# feature branch → MR → prod tartibida boradi.

# =========================
# MASTER / STAGE
# =========================

deploy_stage:
  extends: .deploy_template
  resource_group: stage
  rules:
    - if: '$CI_COMMIT_REF_NAME == "master"'
      when: on_success
  tags:
    - stage

# =========================
# PROD
# =========================

deploy_prod:
