# TEMP: eski (old hesap) shartnoma summalarini tiyinga x100 — [x100-contracts] gate.
# [apply] marker bo'lsa yozadi, aks holda PREVIEW. Idempotent (marker jadval).
# =========================
# =========================
# Bazalarni zaxiralash (read-only) — [backup-db] gate.
# Dumplar serverda /var/backups/hesap/ da, 900 MB dan kichiklari artifact sifatida ham.
# =========================
backup_db_prod:
  stage: deploy
  resource_group: prod
  timeout: 3h
  rules:
    - if: '$CI_COMMIT_REF_NAME == "prod" && $CI_COMMIT_TITLE =~ /\[backup-db\]/'
      when: on_success
  tags:
    - prod
  script:
    - bash scripts/backup/backup-dbs.sh
  artifacts:
    name: hesap-db-backup
    expire_in: 1 day
    when: always
    paths:
      - backup/

