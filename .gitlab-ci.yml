    - if: '$CI_COMMIT_REF_NAME == "prod" && $CI_COMMIT_TITLE =~ /\[mig-payme-txn\]/'
      when: never
    - if: '$CI_COMMIT_REF_NAME == "prod" && $CI_COMMIT_TITLE =~ /\[fix-2927\]/'
      when: never
    - if: '$CI_COMMIT_REF_NAME == "prod" && $CI_COMMIT_TITLE =~ /\[diag-contract\]/'
      when: never
