application:
  token:
    signing:
      key: CHANGE_ME
  # Billing user'ga ko'chdi — companies/balances endi shu servisning o'zida (self-call).
  business-service:
    base-url: ${MAIN_SERVICE:http://localhost:8001}
  # Billing (ko'chirilgan) feign client'lari uchun
  main-service:
    base-url: ${MAIN_SERVICE:http://localhost:8001}
  document-service:
    base-url: ${DOCUMENT_SERVICE:http://localhost:8005}
  notification-service:
    base-url: ${NOTIFICATION_SERVICE:http://localhost:8006}
  integration-service:
    base-url: ${INTEGRATION_SERVICE:http://localhost:8007}
  development: ${DEVELOPMENT_MODE:false}
  test-phones: ${TEST_PHONES:+998000000000,998000000000,998903162999,+998903162999}

  one-id:
    base-url: https://sso.egov.uz
    client-id: hesap_uz
    client-secret: ${ONEID_CLIENT_SECRET:}

logging:
  level:
    reactor:
      netty:
        http:
          client: DEBUG