# ==================== ERROR CODES — English ====================
# ErrorCode.name() → i18n message

# General errors
API_ERROR_CODE=An error occurred while processing the request
ALREADY_EXISTS_ERROR_CODE=This data already exists
USER_PHONE_EXIST=A user with this phone number is already registered
URL_NOT_FOUND=The requested page was not found
USER_NOT_FOUND=User not found
REQUIRED_FIELD_MISSED=A required field is missing
INVALID_EMAIL=Invalid email format
PASSWORD_LENGTH_ERROR=Password length does not meet the requirements
WEAK_PASSWORD=Password is too simple — use a stronger one
WRONG_CODE=Invalid verification code
CATEGORY_NOT_FOUND=Category not found
PASSWORD_MISMATCH=Passwords do not match

# Internal errors
NULL_POINTER_ERROR_CODE=An unexpected internal error occurred. Please try again
UNEXPECTED_VALUE=An unexpected value was detected
UNSUPPORTED_OPERATION_ERROR_CODE=This operation is not supported
INVALID_ARGUMENT_ERROR_CODE=The provided data is invalid
INVALID_CREDENTIALS_ERROR_CODE=Incorrect phone number or password
INVALID_TOKEN_ERROR_CODE=Session expired — please sign in again
CACHE_IS_NOT_WORKING=Temporary system error. Please try again
TOO_MANY_REQUEST=Too many requests — please wait a moment
INVALID_OPERATION_ERROR_CODE=This action cannot be performed in the current state

# Time and system
TIME_EXPIRED=Time expired — please try again
NOT_FOUND_ERROR_CODE=The requested data was not found
LOCKING_CONFLICT_ERROR_CODE=Data is being modified by another user
RETRIEVE_FORBIDDEN_ERROR_CODE=You do not have permission to view this data
SERVICE_UNAVAILABLE_ERROR_CODE=Service is temporarily unavailable — please try later
TIMEOUT_ERROR_CODE=Request timed out — please try again
UNAUTHORIZED_ERROR_CODE=Authentication required
UPDATE_FORBIDDEN_ERROR_CODE=You do not have permission to modify this data
USER_BLOCKED_ERROR_CODE=Your account is blocked — please contact support

# File operations
FILE_DOWNLOAD_ERROR_CODE=Error downloading file
FILE_UPLOAD_ERROR_CODE=Error uploading file
MAX_UPLOAD_SIZE_EXCEEDED=File size is too large
INTERNAL_ERROR_CODE=An internal error occurred. Please try again
IO_EXCEPTION=An I/O error occurred

# Data types
INVALID_TYPE=Invalid data type
BAD_REQUEST_CODE=Invalid request format
JSON_PARSING_ERROR_CODE=Error reading data

# Access
FORBIDDEN_ERROR_CODE=You do not have permission to perform this action
LIST_FORBIDDEN_ERROR_CODE=You do not have permission to view this list
CREATE_FORBIDDEN_ERROR_CODE=You do not have permission to create
DELETE_FORBIDDEN_ERROR_CODE=You do not have permission to delete

# SMS
INVALID_CODE=Invalid verification code
CODE_EXPIRED=Verification code has expired
SMS_SENDING_FAILED=Error sending SMS

# Service connectivity
CONNECTION_REFUSED=Could not connect to the service — please try later
WITNESS_SIGN_REQUIRED=All witnesses must sign first
