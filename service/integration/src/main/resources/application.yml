server:
  port: 8007
  forward-headers-strategy: framework
  servlet:
    contextPath: /
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: integration-service

  webflux:
    base-path: /
  data:
    r2dbc:
      repositories:
        enabled: true

  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_SERVER:localhost:5435}/hesap
#    url: r2dbc:postgresql://${POSTGRES_SERVER:localhost:5435}/hesap
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:}
    properties:
      schema: integration

  liquibase:
    url: jdbc:postgresql://${POSTGRES_SERVER:localhost:5435}/hesap
#    url: jdbc:postgresql://${POSTGRES_SERVER:localhost:5435}/hesap
    user: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:}
    change-log: classpath:db.migration/db.changelog-master.yaml
    enabled: true
    # DATABASECHANGELOG public schema'da turibdi (default). Boshqa servislarda
    # `liquibase-schema: <schema>` ishlatiladi, lekin u target schema mavjud
    # bo'lishini talab qiladi (chicken-and-egg). Integration servisi yangi
    # bo'lgani uchun shu yondashuv tanlandi — init migratsiya schema'ni yaratadi.

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:CHANGE_ME}
    password: ${RABBIT_PASSWORD:}
    exchange: exchange.direct.hesap

springdoc:
  api-docs:
    path: /integration/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: ${spring.application.name}
    version: "@application.version@"
    description: "@application.description@"

