# =============================================================================
# cdn.hesap.uz — public CDN nginx vhost
# =============================================================================
#
# Architecture:
#   Browser → cdn.hesap.uz/contracts/uuid.pdf
#          → nginx (this config)
#          → URL rewrite: /api/files/v1/cdn/contracts/uuid.pdf
#          → file:8004 (file service)
#          → S3 (DigitalOcean Spaces)
#
# Install:
#   sudo cp deploy/nginx/cdn.hesap.uz.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/cdn.hesap.uz.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Pre-requisites:
#   1. DNS:  cdn.hesap.uz A → server IP
#   2. SSL:  certbot certonly --nginx -d cdn.hesap.uz
#   3. File service container running on 127.0.0.1:8004
# =============================================================================

# --- nginx proxy cache zone (init once, shared across vhosts) -----------------
# Buni /etc/nginx/nginx.conf ichida http {} block'da bo'lishi kerak,
# agar yo'q bo'lsa, qo'shing:
#   proxy_cache_path /var/cache/nginx/cdn levels=1:2
#       keys_zone=cdn_cache:10m max_size=2g inactive=30d use_temp_path=off;

# --- HTTP → HTTPS redirect ----------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cdn.hesap.uz;

    # Let's Encrypt validation (certbot uchun)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server -------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.hesap.uz;

    # --- SSL ------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/cdn.hesap.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.hesap.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/cdn.hesap.uz/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Logging --------------------------------------------------------------
    access_log /var/log/nginx/cdn.hesap.uz.access.log;
    error_log  /var/log/nginx/cdn.hesap.uz.error.log warn;

    # --- Security headers -----------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- CORS (public CDN — barcha origin'lar) -------------------------------
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Max-Age       "3600" always;

    # OPTIONS preflight — tezroq qaytarish
    if ($request_method = OPTIONS) {
        return 204;
    }

    # --- Limits ---------------------------------------------------------------
    client_max_body_size 100M;
    keepalive_timeout 60s;

    # --- Faqat ruxsat etilgan folder'lar -------------------------------------
    # Boshqa path'lar yopiq (xavfsizlik uchun).
    location ~* ^/(images|stories|videos|contracts)/(.+)$ {
        # cdn.hesap.uz/contracts/uuid.pdf
        # → file:8004/api/files/v1/cdn/contracts/uuid.pdf
        rewrite ^/(.+)/(.+)$ /api/files/v1/cdn/$1/$2 break;

        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # Timeout (S3 large files uchun)
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffering — kichik fayllar uchun yoqilgan, kattalar uchun bypass
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # Nginx-side cache — backendga har safar bormaslik
        proxy_cache cdn_cache;
        proxy_cache_valid 200 206 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        proxy_cache_lock on;
        proxy_cache_key  "$scheme$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;

        # Error handling
        proxy_intercept_errors off;
    }

    # --- Health check (ixtiyoriy) ---------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- Boshqa hamma narsa 404 -----------------------------------------------
    location / {
        return 404 "Not Found\n";
        add_header Content-Type text/plain;
    }
}
