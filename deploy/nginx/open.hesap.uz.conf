# =============================================================================
# open.hesap.uz — hamkorlar uchun public API (OpenAPI) vhost
# =============================================================================
#
# Arxitektura:
#   Hamkor → open.hesap.uz/v1/contracts
#          → nginx (shu config)
#          → rewrite: /openapi/v1/contracts
#          → api-gateway:8000
#          → document-service:8005
#
# Ya'ni alohida servis EMAS — mavjud gateway'ning `/openapi/**` yo'liga
# chiroyli subdomen. `api.business.hesap.uz/openapi/v1/...` ham ishlashda davom
# etadi (eski integratsiyalar buzilmasin).
#
# O'rnatish:
#   sudo cp deploy/nginx/open.hesap.uz.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/open.hesap.uz.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Shartlar:
#   1. DNS:  open.hesap.uz A → server IP
#   2. SSL:  certbot certonly --nginx -d open.hesap.uz
#   3. api-gateway 127.0.0.1:8000 da ishlab turishi
# =============================================================================

# --- Rate limit zone ----------------------------------------------------------
# Public API — kalit bo'yicha emas, IP bo'yicha oddiy himoya. Zone http {} da
# bo'lishi kerak; agar nginx.conf'da yo'q bo'lsa shu qatorni /etc/nginx/conf.d/
# ichidagi faylga ko'chiring.
limit_req_zone $binary_remote_addr zone=openapi_rl:10m rate=20r/s;

# --- HTTP → HTTPS redirect ----------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name open.hesap.uz;

    # Let's Encrypt validation (certbot uchun)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server -------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name open.hesap.uz;

    # --- SSL ------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/open.hesap.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open.hesap.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/open.hesap.uz/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Logging --------------------------------------------------------------
    access_log /var/log/nginx/open.hesap.uz.access.log;
    error_log  /var/log/nginx/open.hesap.uz.error.log warn;

    # --- Security headers -----------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Limits ---------------------------------------------------------------
    client_max_body_size 10M;
    keepalive_timeout 60s;

    # =========================================================================
    # Public API: open.hesap.uz/v1/... → gateway:8000/openapi/v1/...
    # =========================================================================
    location /v1/ {
        limit_req zone=openapi_rl burst=40 nodelay;

        rewrite ^/v1/(.*)$ /openapi/v1/$1 break;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # X-API-Key headeri o'zgarmasdan o'tadi (proxy_set_header shart emas).

        # PDF generatsiyasi sekinroq bo'lishi mumkin.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }

    # =========================================================================
    # Spetsifikatsiya: open.hesap.uz/api-docs → gateway:8000/v3/api-docs/openapi
    # =========================================================================
    location = /api-docs {
        rewrite ^ /v3/api-docs/openapi break;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;

        # Spec'ni browser'dan o'qish mumkin bo'lsin (Swagger/Postman import).
        add_header Access-Control-Allow-Origin "*" always;
    }

    # --- Health check ---------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- Boshqa hamma narsa 404 -----------------------------------------------
    # Faqat /v1/** va /api-docs ochiq — kabinet/ichki endpointlar bu subdomendan
    # ko'rinmaydi.
    location / {
        return 404 "Not Found\n";
        add_header Content-Type text/plain;
    }
}
