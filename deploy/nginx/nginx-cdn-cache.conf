# =============================================================================
# Nginx http {} block uchun cache zone — cdn.hesap.uz uchun
# =============================================================================
#
# Joylash: /etc/nginx/conf.d/cdn-cache.conf
#
# Cache folder oldindan yaratilishi kerak:
#   sudo mkdir -p /var/cache/nginx/cdn
#   sudo chown -R www-data:www-data /var/cache/nginx/cdn
#
# Yoki nginx.conf'da http {} block ichiga to'g'ridan-to'g'ri qo'shish.
# =============================================================================

proxy_cache_path /var/cache/nginx/cdn
    levels=1:2
    keys_zone=cdn_cache:10m
    max_size=2g
    inactive=30d
    use_temp_path=off;
